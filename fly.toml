# Fly.io app config for the backend API.
#
# First-time setup (from the repo root):
#   fly launch --no-deploy --dockerfile backend/Dockerfile --name autobody-intake-api
#   fly postgres create --name autobody-intake-db
#   fly postgres attach autobody-intake-db -a autobody-intake-api
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32) \
#     RESEND_API_KEY=... EMAIL_FROM="AutoBody Intake <intake@yourdomain.com>" \
#     S3_ACCESS_KEY_ID=... S3_SECRET_ACCESS_KEY=... S3_BUCKET=... S3_ENDPOINT=... \
#     OPENAI_API_KEY=... INTAKE_BASE_URL=https://your-web-intake-domain
#   fly deploy --dockerfile backend/Dockerfile
#
# `fly postgres attach` injects DATABASE_URL as a secret automatically.
# See docs/DEPLOYMENT.md for the full walkthrough.

app = "autobody-intake-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  # Non-secret defaults — override real values with `fly secrets set`.
  AI_MODEL = "gpt-4o-mini"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Uploaded files (local-disk driver) don't survive redeploys/restarts on Fly
# without a volume — for production use the S3/R2 storage driver (set
# S3_* secrets above) instead of relying on local disk.

